<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Envíos - Carros Escala Perú</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    /* Estilos generales */
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    /* Modal Visor de Fotos */
    .image-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.88);
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .image-modal.active {
      display: flex;
    }

    /* Contenedor del reporte imprimible de despachos */
    #report-print-container {
      display: none;
    }

    /* Estilos de Impresión A4 de Rótulos */
    @page {
      size: A4 portrait;
      margin: 6mm 8mm 6mm 8mm;
    }

    @media print {
      body * {
        visibility: hidden;
      }
      
      /* Modo Rótulos A4 */
      body.printing-labels #print-container,
      body.printing-labels #print-container * {
        visibility: visible;
      }
      body.printing-labels #print-container {
        display: block !important;
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: white;
      }

      /* Modo Reporte PDF de Despachados */
      body.printing-report #report-print-container,
      body.printing-report #report-print-container * {
        visibility: visible;
      }
      body.printing-report #report-print-container {
        display: block !important;
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: white;
        color: #0f172a;
      }

      .page-break {
        page-break-after: always;
        break-after: page;
      }
    }

    /* Cuadrícula de 8 Rótulos por Hoja A4 (2 columnas x 4 filas) */
    .a4-sheet {
      width: 194mm;
      height: 284mm;
      display: grid;
      grid-template-columns: repeat(2, 94mm);
      grid-template-rows: repeat(4, 67mm);
      gap: 3mm 6mm;
      box-sizing: border-box;
      margin: 0 auto;
    }

    .print-box-wrapper {
      width: 94mm;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    .print-box-bordered {
      width: 100%;
      height: 53mm;
      border: 3.5px solid #000;
      border-radius: 18px;
      padding: 6px 10px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      background: #fff;
      color: #000;
    }

    .print-box-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
    }

    .print-header-title {
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 4px;
      color: #000;
    }

    .customer-data-text {
      font-size: 16px;
      font-weight: 900;
      line-height: 1.22;
      color: #000;
      text-transform: uppercase;
      word-break: break-word;
      white-space: pre-line;
      margin-top: 2px;
    }

    .print-label-meta {
      margin-top: 2px;
      padding: 0 4px;
      font-size: 9.5px;
      line-height: 1.2;
      color: #000;
      text-transform: uppercase;
    }
  </style>
</head>

  <!-- LÓGICA DEL PIN INDEPENDIENTE -->
  <script>
    const CORRECT_PIN = "9347";
    let enteredPin = "";

    function updatePinDots() {
      const dots = document.querySelectorAll('.pin-dot');
      dots.forEach((dot, index) => {
        if (index < enteredPin.length) {
          dot.classList.add('bg-indigo-500', 'border-indigo-400');
        } else {
          dot.classList.remove('bg-indigo-500', 'border-indigo-400');
        }
      });
    }

    function pressPin(num) {
      if (enteredPin.length < 4) {
        enteredPin += num;
        updatePinDots();
        if (enteredPin.length === 4) {
          setTimeout(validatePin, 100);
        }
      }
    }

    function clearPin() {
      enteredPin = "";
      updatePinDots();
    }

    function backspacePin() {
      enteredPin = enteredPin.slice(0, -1);
      updatePinDots();
    }

    function validatePin() {
      if (enteredPin === CORRECT_PIN) {
        document.getElementById('pin-screen').classList.add('hidden');
        document.getElementById('app').classList.remove('hidden');
        sessionStorage.setItem('unlocked', 'true');
      } else {
        alert('PIN Incorrecto');
        clearPin();
      }
    }

    // Soporte para teclado físico
    window.addEventListener('keydown', (e) => {
      if (sessionStorage.getItem('unlocked') === 'true') return;
      if (e.key >= '0' && e.key <= '9') pressPin(e.key);
      if (e.key === 'Backspace') backspacePin();
      if (e.key === 'Escape') clearPin();
    });

    if (sessionStorage.getItem('unlocked') === 'true') {
      document.getElementById('pin-screen').classList.add('hidden');
      document.getElementById('app').classList.remove('hidden');
    }
  </script>

  <!-- FIREBASE SCRIPTS -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
    import { 
      getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDEhWffvRTicQwkna_juO_8MASorZ6MMK8",
      authDomain: "envios-1e845.firebaseapp.com",
      projectId: "envios-1e845",
      storageBucket: "envios-1e845.firebasestorage.app",
      messagingSenderId: "716659838405",
      appId: "1:716659838405:web:66b8ed01affa6c550e0fac",
      measurementId: "G-VPSF9CLQSZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let ordersCache = [];
    let pendingDeleteId = null;

    // Autenticación anónima
    signInAnonymously(auth).catch(err => {
      console.warn("Auth error:", err);
      const status = document.getElementById('cloud-status');
      if (status) {
        status.className = "px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-950 text-amber-300 border border-amber-800/50";
        status.innerText = "⚠️ Modo Local";
      }
    });

    // Escucha en tiempo real de Firestore
    const ordersCol = collection(db, "orders");
    onSnapshot(ordersCol, (snapshot) => {
      ordersCache = [];
      snapshot.forEach(docSnap => {
        ordersCache.push({ id: docSnap.id, ...docSnap.data() });
      });
      // Ordenar por fecha de creación descendente
      ordersCache.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      renderDispatchCards();
    }, (error) => {
      console.error("Firestore error:", error);
    });

    // Renderizar tarjetas de despacho
    function renderDispatchCards() {
      const grid = document.getElementById('dispatch-grid');
      const counter = document.getElementById('pending-counter');
      grid.innerHTML = "";

      let pendingCount = 0;

      ordersCache.forEach(order => {
        if (!order.packed) pendingCount++;

        const isPacked = order.packed === true;
        const hasNote = order.specialNote && order.specialNote.trim() !== "";

        const card = document.createElement('div');
        card.className = `rounded-2xl p-4 transition border ${
          isPacked 
            ? 'bg-slate-900/40 border-slate-800/60 opacity-80' 
            : hasNote
              ? 'bg-slate-900/90 border-red-500/80 ring-2 ring-red-500/20'
              : 'bg-slate-900/90 border-slate-700/80'
        }`;

        card.innerHTML = `
          <div class="flex justify-between items-start gap-2 mb-2">
            <div>
              <span class="text-xs font-mono font-bold text-indigo-400">${order.customerIdentifier || 'SIN ID'}</span>
              <h4 class="text-sm font-extrabold text-white leading-snug">${order.productName || 'Sin Producto'}</h4>
            </div>
            <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${
              isPacked ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'
            }">
              ${isPacked ? 'EMPACADO' : 'PENDIENTE'}
            </span>
          </div>

          <!-- Indicación especial en rojo vistoso -->
          ${hasNote ? `
            <div class="mb-3 bg-red-950/40 border-2 border-red-500 rounded-xl p-2.5">
              <div class="text-[11px] font-black text-red-400 flex items-center gap-1 uppercase tracking-wider mb-0.5">
                <span>🚨</span> INDICACIÓN ESPECIAL / OJO:
              </div>
              <div class="bg-red-900/30 border border-red-500/30 rounded-lg p-2 text-white font-bold text-xs">
                ${order.specialNote}
              </div>
            </div>
          ` : ''}

          <!-- Datos de entrega -->
          <div class="bg-slate-800/60 rounded-xl p-2.5 mb-3 text-xs text-slate-300 font-mono whitespace-pre-line leading-relaxed">
            ${order.customerData || 'Sin datos'}
          </div>

          <!-- Foto del paquete (Clicable sin botón de copiar) -->
          ${order.photoUrl ? `
            <div class="mb-3">
              <p class="text-[11px] text-slate-400 font-semibold mb-1">Foto del Paquete (Clic para agrandar):</p>
              <img src="${order.photoUrl}" 
                   onclick="window.openImageViewer('${order.photoUrl}')" 
                   alt="Foto del paquete" 
                   class="w-full h-36 object-cover rounded-xl border border-slate-700 cursor-pointer hover:opacity-90 active:scale-[0.99] transition shadow-md">
            </div>
          ` : `
            <div class="mb-3">
              <label class="block text-center border-2 border-dashed border-slate-700 hover:border-slate-500 rounded-xl p-2.5 cursor-pointer transition">
                <span class="text-xs text-slate-400 font-semibold">📷 Subir Foto de Paquete</span>
                <input type="file" accept="image/*" capture="environment" class="hidden" onchange="window.uploadPackagePhoto('${order.id}', this)">
              </label>
            </div>
          `}

          <!-- Botones de Acción -->
          <div class="space-y-2 pt-1 border-t border-slate-800/80">
            <button onclick="window.togglePackStatus('${order.id}', ${!isPacked})" class="w-full py-2 rounded-xl text-xs font-bold transition flex items-center justify-center gap-1.5 ${
              isPacked 
                ? 'bg-slate-800 hover:bg-slate-700 text-slate-300' 
                : 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-600/20'
            }">
              <span>${isPacked ? '↩️ Desmarcar' : '📦 Empacado'}</span>
            </button>

            <button onclick="window.openDeleteModal('${order.id}')" class="w-full py-1.5 rounded-xl bg-red-950/30 hover:bg-red-900/40 text-red-400 border border-red-800/30 text-xs font-semibold transition flex items-center justify-center gap-1">
              <span>🗑️</span> Borrar Pedido
            </button>
          </div>
        `;

        grid.appendChild(card);
      });

      counter.innerText = pendingCount;
    }

    // Funciones globales vinculadas a window
    window.toggleModal = (modalId) => {
      const modal = document.getElementById(modalId);
      modal.classList.toggle('hidden');
      modal.classList.toggle('flex');
    };

    window.saveNewOrder = async () => {
      const identifier = document.getElementById('order-id-input').value.trim();
      const product = document.getElementById('order-product-input').value.trim();
      const data = document.getElementById('order-data-input').value.trim();
      const note = document.getElementById('order-note-input').value.trim();

      if (!data) {
        alert("Ingresa los datos para el rótulo.");
        return;
      }

      try {
        await addDoc(ordersCol, {
          customerIdentifier: identifier,
          productName: product,
          customerData: data,
          specialNote: note,
          packed: false,
          photoUrl: "",
          createdAt: serverTimestamp()
        });

        document.getElementById('order-id-input').value = "";
        document.getElementById('order-product-input').value = "";
        document.getElementById('order-data-input').value = "";
        document.getElementById('order-note-input').value = "";

        window.toggleModal('new-order-modal');
      } catch (e) {
        alert("Error al guardar pedido: " + e.message);
      }
    };

    window.togglePackStatus = async (id, status) => {
      try {
        const orderRef = doc(db, "orders", id);
        await updateDoc(orderRef, { packed: status });
      } catch (e) {
        console.error("Error al actualizar:", e);
      }
    };

    window.openDeleteModal = (id) => {
      pendingDeleteId = id;
      const modal = document.getElementById('delete-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    };

    window.closeDeleteModal = () => {
      pendingDeleteId = null;
      const modal = document.getElementById('delete-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    };

    document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
      if (!pendingDeleteId) return;
      try {
        await deleteDoc(doc(db, "orders", pendingDeleteId));
        window.closeDeleteModal();
      } catch (e) {
        alert("Error al borrar: " + e.message);
      }
    });

    // Compresión y guardado de foto del paquete
    window.uploadPackagePhoto = (id, input) => {
      const file = input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 720;
          let width = img.width;
          let height = img.height;

          if (width > MAX_WIDTH) {
            height = Math.round((height * MAX_WIDTH) / width);
            width = MAX_WIDTH;
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedBase64 = canvas.toDataURL('image/jpeg', 0.65);
          updateDoc(doc(db, "orders", id), { photoUrl: compressedBase64 });
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    };

    // Visor de Fotos
    window.openImageViewer = (src) => {
      document.getElementById('full-screen-image').src = src;
      document.getElementById('image-viewer-modal').classList.add('active');
    };

    window.closeImageViewer = () => {
      document.getElementById('image-viewer-modal').classList.remove('active');
    };

    // Limpieza de datos de envío (elimina línea de Destino)
    function sanitizeCustomerData(rawText) {
      if (!rawText) return "";
      return rawText
        .split('\n')
        .map(l => l.trim())
        .filter(l => {
          const clean = l.replace(/[^\w\s]/gi, '').trim().toUpperCase();
          return clean !== "DESTINO" && clean !== "DATOS DEL DESTINATARIO";
        })
        .join('\n');
    }

    // Logo Vectorial / Carga de logo.png
    function getLogoHtml() {
      return `
        <div style="height: 28px; display: flex; align-items: center;">
          <img src="logo.png" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" style="height: 28px; max-width: 95px; object-fit: contain;">
          <svg style="display:none; height: 26px; width: 90px;" viewBox="0 0 160 50">
            <text x="2" y="20" font-family="Arial Black, Impact" font-weight="900" font-style="italic" font-size="14" fill="#000">CARROS ESCALA</text>
            <text x="18" y="42" font-family="Arial Black, Impact" font-weight="900" font-style="italic" font-size="24" fill="#e11d48">PERU</text>
            <path d="M110 32 C120 32 135 30 148 35 C152 36 156 39 157 43 L105 43" stroke="#000" stroke-width="2.5" fill="none"/>
            <path d="M125 24 C132 20 142 20 150 25 L155 33" stroke="#000" stroke-width="2.5" fill="none"/>
          </svg>
        </div>
      `;
    }

    // GENERAR RÓTULOS SHALOM EN FORMATO A4 (8 POR HOJA)
    window.openPrintModal = () => {
      const activeOrders = ordersCache.filter(o => !o.packed);
      if (activeOrders.length === 0) {
        alert("No hay pedidos pendientes para generar rótulos.");
        return;
      }

      const container = document.getElementById('print-container');
      container.innerHTML = "";

      const pageSize = 8;
      const totalPages = Math.ceil(activeOrders.length / pageSize);

      for (let p = 0; p < totalPages; p++) {
        const pageOrders = activeOrders.slice(p * pageSize, (p + 1) * pageSize);
        const sheet = document.createElement('div');
        sheet.className = `a4-sheet ${p < totalPages - 1 ? 'page-break' : ''}`;

        pageOrders.forEach(order => {
          const cleanData = sanitizeCustomerData(order.customerData);
          const item = document.createElement('div');
          item.className = "print-box-wrapper";
          item.innerHTML = `
            <div class="print-box-bordered">
              <div class="print-box-header">
                <div class="print-header-title">
                  <span>📦</span> DATOS DEL DESTINATARIO
                </div>
                ${getLogoHtml()}
              </div>
              <div class="customer-data-text">${cleanData}</div>
            </div>
            <!-- Pie de rótulo con ID en vez de CLIENTE -->
            <div class="print-label-meta">
              <div><b>ID:</b> ${order.customerIdentifier || 'N/A'}</div>
              <div><b>PRODUCTO:</b> ${order.productName || 'N/A'}</div>
            </div>
          `;
          sheet.appendChild(item);
        });

        container.appendChild(sheet);
      }

      document.body.className = "printing-labels";
      window.print();
      setTimeout(() => {
        document.body.className = "";
      }, 1000);
    };

    // LIMPIAR DESPACHADOS CON EXPORTACIÓN A PDF Y FECHA DEL DÍA
    window.handleCleanDispatched = async () => {
      const dispatchedOrders = ordersCache.filter(o => o.packed === true);

      if (dispatchedOrders.length === 0) {
        alert("No hay pedidos empacados para limpiar.");
        return;
      }

      // 1. Obtener la fecha actual (YYYY-MM-DD)
      const now = new Date();
      const dateString = now.toISOString().split('T')[0];
      const previousTitle = document.title;
      document.title = `Despacho_${dateString}`;

      // 2. Generar el reporte con las tarjetas de despacho
      const reportContainer = document.getElementById('report-print-container');
      reportContainer.innerHTML = `
        <div style="padding: 20px; font-family: sans-serif;">
          <div style="display: flex; justify-content: space-between; align-items: center; border-b: 2px solid #000; padding-bottom: 10px; margin-bottom: 16px;">
            <div>
              <h1 style="font-size: 20px; font-weight: 900; margin: 0; color: #000;">REPORTE DE DESPACHO DIARIO</h1>
              <p style="font-size: 13px; color: #475569; margin: 2px 0 0 0;">Fecha: <b>${dateString}</b> | Total despachados: <b>${dispatchedOrders.length}</b></p>
            </div>
            ${getLogoHtml()}
          </div>

          <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px;">
            ${dispatchedOrders.map(order => `
              <div style="border: 1.5px solid #cbd5e1; border-radius: 12px; padding: 10px; page-break-inside: avoid; background: #fff;">
                <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
                  <span style="font-size: 12px; font-weight: bold; color: #4338ca;">ID: ${order.customerIdentifier || 'N/A'}</span>
                  <span style="font-size: 10px; font-weight: bold; background: #dcfce7; color: #15803d; padding: 2px 6px; border-radius: 6px;">DESPACHADO</span>
                </div>
                <div style="font-size: 13px; font-weight: 800; color: #000; margin-bottom: 4px;">${order.productName \vert{}\vert{} 'Sin Producto'}</div>${order.specialNote ? `
                  <div style="font-size: 11px; background: #fee2e2; color: #b91c1c; padding: 4px 6px; border-radius: 6px; margin-bottom: 6px; font-weight: bold;">
                    ⚠️ ${order.specialNote}
                  </div>
                ` : ''}

                <div style="font-size: 11px; font-family: monospace; white-space: pre-line; color: #334155; margin-bottom: 6px; background: #f8fafc; padding: 6px; border-radius: 6px;">${order.customerData \vert{}\vert{} ''}</div>${order.photoUrl ? `
                  <img src="${order.photoUrl}" style="width: 100%; height: 120px; object-fit: cover; border-radius: 8px; border: 1px solid #e2e8f0;">
                ` : '<div style="font-size: 10px; color: #94a3b8; font-style: italic;">Sin foto adjunta</div>'}
              </div>
            `).join('')}
          </div>
        </div>
      `;

      // 3. Abrir la ventana para Guardar como PDF
      document.body.className = "printing-report";
      window.print();

      // Restaurar el título original
      setTimeout(() => {
        document.body.className = "";
        document.title = previousTitle;
      }, 1000);

      // 4. Confirmar eliminación de Firebase
      setTimeout(async () => {
        const confirmDelete = confirm(`Se preparó el PDF con fecha ${dateString}.\n\n¿Deseas eliminar definitivamente estos ${dispatchedOrders.length} pedidos empacados de la base de datos?`);
        if (confirmDelete) {
          try {
            for (const order of dispatchedOrders) {
              await deleteDoc(doc(db, "orders", order.id));
            }
          } catch (e) {
            alert("Error al limpiar pedidos: " + e.message);
          }
        }
      }, 1500);
    };
  </script>
</body>
</html>
